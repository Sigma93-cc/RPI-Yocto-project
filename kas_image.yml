header:
  version: 18

machine: raspberrypi3-64
distro: sigmastudio
target: 
  - my-image
  - swupdate-image-bundle
build_system: openembedded

artifacts:
  disk-image: image

local_conf_header: 
  rpi_specific: |
    ENABLE_UART = "1"
    ENABLE_SPI_BUS = "1"
    RPI_EXTRA_CONFIG = "dtoverlay=waveshare35b-v2\ndtoverlay=disable-bt"
    DISPLAY_ROTATE = "0"
    DISABLE_VC4GRAPHICS = "1"
    DISABLE_RPI_BOOT_LOGO = "1"
    RPI_USE_U_BOOT = "1"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
repos:
  poky:
    url: https://git.yoctoproject.org/poky.git
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
    path: sources/poky
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
    path: sources/meta-openembedded
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: scarthgap
    path: sources/meta-raspberrypi
  meta-qt5:
    url: https://github.com/meta-qt5/meta-qt5.git
    branch: scarthgap
    path: sources/meta-qt5
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    branch: scarthgap
    path: sources/meta-swupdate
  meta-my:
    url: https://github.com/Sigma93-cc/meta-image-RPI3B.git
    branch: scarthgap
    path: sources/meta-my
    

